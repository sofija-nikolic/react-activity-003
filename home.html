<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter 11</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">

  <link rel="stylesheet" href="styles.css" />

  <!--The React JS libraries -->
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <!--Initially, we will use the babel run-time library to convert JSX in the browser -->
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <script src="movie-data.js"></script>

  <script type="text/babel">

    /*
    ------------------------------------------------------------------------------------------------------------------
    */
    class App extends React.Component {

      constructor(props) {
        super(props);
        this.state = {
          movies: movieData
        };
        this.saveChanges = this.saveChanges.bind(this);
      }

      saveChanges(index, updatedMovie) {
        // copy the current movies array so we don't mutate state directly
        const movies = [...this.state.movies];
        // replace the one movie that changed
        movies[index] = updatedMovie;
        // update state, which triggers a re-render
        this.setState({ movies: movies });
      }

      render() {
        return (
                <main className="container">
                  <section className="columns has-background-light">
                    <MovieList movies={ this.state.movies }/>
                    <div className="column is-half">
                      { this.state.movies.map((movie, index) =>
                              <MovieForm movie={movie} index={index} key={movie.id}
                                         saveChanges={this.saveChanges} />
                      )}
                    </div>
                  </section>
                </main>
        );
      }

    }


    /*
    ------------------------------------------------------------------------------------------------------------------
    */
    class MovieForm extends React.Component {

      constructor(props) {
        super(props);
        this.handleChange = this.handleChange.bind(this);
      }

      handleChange(event) {
        // build an updated copy of this movie with the changed field
        const updatedMovie = {
          ...this.props.movie,
          [event.target.name]: event.target.value
        };
        // tell App about the change, including which index this movie is
        this.props.saveChanges(this.props.index, updatedMovie);
      }

      render() {
        const movie = this.props.movie;

        return (
                <form className="panel has-background-grey-lighter"  >

                  <div className="field is-horizontal">
                    <div className="field-label is-normal">
                      <label className="label">Title</label>
                    </div>
                    <div className="field-body">
                      <input className="input" type="text" name="title"
                             value={movie.title} onChange={this.handleChange} />
                    </div>
                  </div>

                  <div className="field is-horizontal">
                    <div className="field-label is-normal">
                      <label className="label">Tagline</label>
                    </div>
                    <div className="field-body">
                        <textarea className="textarea" rows="2"  name="tagline"
                                  value={movie.tagline} onChange={this.handleChange}></textarea>
                    </div>
                  </div>

                  <div className="field is-horizontal">
                    <div className="field-label is-normal">
                      <label className="label">Runtime</label>
                    </div>
                    <div className="field-body">
                      <input className="input" type="text" name="runtime"
                             value={movie.runtime} onChange={this.handleChange}/>
                    </div>
                  </div>

                </form>
        );
      }
    }

    /*
    ------------------------------------------------------------------------------------------------------------------
    */
    class MovieList extends React.Component {

      render() {
        return (
                <div className="column is-half">
                  <ul className="columns is-multiline">
                    { this.props.movies.map(movie =>
                            <SingleMovie movie={movie} key={movie.id} />
                    )}
                  </ul>
                </div>
        );
      }

    }

    /*
    ------------------------------------------------------------------------------------------------------------------
    */
    class SingleMovie extends React.Component {

      render() {
        const movie = this.props.movie;
        const posterUrl = "https://image.tmdb.org/t/p/w185" + movie.poster;

        return (
                <li className="column is-one-third-desktop is-half-tablet"  >
                  <div className="card">
                    <div className="card-image">
                      <figure className="image is-2by3">
                        <img src={posterUrl} alt={movie.title} />
                      </figure>
                    </div>
                    <div className="card-content has-text-centered content-rectangle">
                      <h2 className="title is-6">{movie.title} ({movie.runtime} min)</h2>
                      <p className="is-size-7">{movie.tagline}</p>
                    </div>
                    <footer className="card-footer">
                      <MovieLink id={movie.tmdbID} />
                    </footer>
                  </div>
                </li>
        )

      }

    }


    /*
    ------------------------------------------------------------------------------------------------------------------
    */
    const MovieLink = props => {
      return (
              <a className="button card-footer-item"
                 href={ "https://www.themoviedb.org/movie/" + props.id } >

                <img src="images/tmdb.svg" width="30" />
              </a>
      );
    };

    ReactDOM.render(<App />, document.querySelector('#react-container'));

  </script>


</head>
<body>
<div id='react-container' ></div>
</body>
</html>
